version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: betfit-postgres
    restart: always
    environment:
      POSTGRES_USER: betfit
      POSTGRES_PASSWORD: betfit_dev_secret_2026
      POSTGRES_DB: betfit_production
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U betfit -d betfit_production']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: betfit-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betfit-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://betfit:betfit_dev_secret_2026@postgres:5432/betfit_production
      REDIS_URL: redis://redis:6379
      JWT_SECRET: betfit-production-jwt-token-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
